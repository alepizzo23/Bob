<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Un regalo para ti 🎁</title>
<style>
  :root {
    --bg1: #2b0f3a;
    --bg2: #12061c;
    --box: #e8366f;
    --box-dark: #b81f52;
    --ribbon: #ffd166;
    --ticket: #fff7e8;
    --ink: #2b0f3a;
    --accent: #e8366f;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: radial-gradient(circle at 50% 30%, var(--bg1), var(--bg2));
    color: #fff;
    display: grid;
    place-items: center;
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }

  .stage { position: relative; width: min(340px, 90vw); height: 460px; display: grid; place-items: end center; }

  .hint {
    position: absolute; top: 0; left: 0; right: 0; text-align: center;
    font-size: 1.3rem; letter-spacing: .02em; opacity: .9;
    animation: pulse 1.6s ease-in-out infinite;
  }
  .opened .hint { opacity: 0; animation: none; transition: opacity .3s; }

  /* ---------- Caja ---------- */
  .gift { position: relative; width: 220px; height: 200px; margin-bottom: 20px; cursor: pointer; animation: wiggle 2.4s ease-in-out infinite; }
  .opened .gift { animation: none; cursor: default; }

  .box {
    position: absolute; bottom: 0; left: 10px; width: 200px; height: 150px;
    background: linear-gradient(90deg, var(--box-dark), var(--box) 30%, var(--box) 70%, var(--box-dark));
    border-radius: 6px; z-index: 3;
  }
  .box::before { /* cinta vertical */
    content: ""; position: absolute; left: 50%; top: 0; bottom: 0; width: 28px; transform: translateX(-50%);
    background: var(--ribbon);
  }

  .lid {
    position: absolute; top: 20px; left: 0; width: 220px; height: 44px;
    background: linear-gradient(90deg, var(--box-dark), var(--box) 30%, var(--box) 70%, var(--box-dark));
    border-radius: 6px; z-index: 4;
    transition: transform .9s cubic-bezier(.2,.8,.3,1), opacity .9s;
  }
  .lid::before {
    content: ""; position: absolute; left: 50%; top: 0; bottom: 0; width: 28px; transform: translateX(-50%);
    background: var(--ribbon);
  }
  .bow { position: absolute; left: 50%; top: -34px; transform: translateX(-50%); width: 90px; height: 40px; }
  .bow::before, .bow::after {
    content: ""; position: absolute; top: 4px; width: 40px; height: 34px;
    border: 9px solid var(--ribbon); border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
  }
  .bow::before { left: 2px; transform: rotate(-20deg); }
  .bow::after { right: 2px; transform: rotate(20deg); }

  .opened .lid { transform: translate(140px, -320px) rotate(55deg); opacity: 0; }

  /* ---------- Ticket ---------- */
  .ticket {
    position: absolute; left: 50%; bottom: 60px; width: 300px; z-index: 2;
    transform: translate(-50%, 40px) scale(.6); opacity: 0;
    transition: transform 1s cubic-bezier(.2,1.3,.4,1) .35s, opacity .4s .35s;
    background: var(--ticket); color: var(--ink);
    border-radius: 14px; display: flex; overflow: hidden;
    box-shadow: 0 20px 50px rgba(0,0,0,.45);
    pointer-events: none;
  }
  .opened .ticket { transform: translate(-50%, -140px) scale(1); opacity: 1; z-index: 5; }

  .ticket .main { flex: 1; padding: 18px 16px; border-right: 2px dashed rgba(43,15,58,.25); position: relative; }
  .ticket .stub {
    width: 64px; display: grid; place-items: center; background: var(--accent); color: #fff;
    writing-mode: vertical-rl; font-weight: 800; letter-spacing: .2em; font-size: .8rem;
  }
  .label { font-size: .65rem; text-transform: uppercase; letter-spacing: .15em; opacity: .55; }
  .artist { font-size: 1.6rem; font-weight: 900; line-height: 1.1; margin: 4px 0 12px; color: var(--accent); }
  .row { display: flex; gap: 14px; margin-top: 8px; }
  .row div { flex: 1; }
  .value { font-weight: 700; font-size: .95rem; }

  .message {
    position: absolute; left: 0; right: 0; bottom: 0; text-align: center;
    font-size: 1.15rem; line-height: 1.4; padding: 0 10px;
    opacity: 0; transform: translateY(10px);
    transition: opacity .8s 1.3s, transform .8s 1.3s;
  }
  .opened .message { opacity: 1; transform: none; }
  .opened .gift { transition: transform .8s .9s, opacity .8s .9s; transform: translateY(60px) scale(.7); opacity: 0; }

  /* ---------- Confeti ---------- */
  .confetti { position: fixed; top: -12px; width: 10px; height: 14px; pointer-events: none; z-index: 10; animation: fall linear forwards; }

  @keyframes wiggle {
    0%, 70%, 100% { transform: rotate(0); }
    75% { transform: rotate(-6deg); }
    80% { transform: rotate(6deg); }
    85% { transform: rotate(-4deg); }
    90% { transform: rotate(4deg); }
  }
  @keyframes pulse { 50% { opacity: .5; } }
  @keyframes fall { to { transform: translate(var(--dx), 110vh) rotate(var(--rot)); } }

  @media (prefers-reduced-motion: reduce) {
    .gift, .hint { animation: none; }
  }
</style>
</head>
<body>

<div class="stage" id="stage">
  <p class="hint">Toca el regalo 🎁</p>

  <div class="ticket" aria-hidden="true">
    <div class="main">
      <div class="label">Admite 2 · Concierto</div>
      <div class="artist" id="artist"></div>
      <div class="row">
        <div><div class="label">Fecha</div><div class="value" id="date"></div></div>
        <div><div class="label">Hora</div><div class="value" id="time"></div></div>
      </div>
      <div class="row">
        <div><div class="label">Lugar</div><div class="value" id="venue"></div></div>
      </div>
    </div>
    <div class="stub">TICKET</div>
  </div>

  <div class="gift" id="gift" role="button" tabindex="0" aria-label="Abrir regalo">
    <div class="lid"><div class="bow"></div></div>
    <div class="box"></div>
  </div>

  <p class="message" id="message"></p>
</div>

<script>
  // ✏️ Cambia estos datos por los del concierto
  const GIFT = {
    artist:  "Tokio Hotel",
    date:    "04 Nov 2026",
    time:    "20:00",
    venue:   "AFAS Live",
    message: "¡Nos vamos al concierto! ❤️<br>Te quiero mucho"
  };

  document.getElementById("artist").textContent = GIFT.artist;
  document.getElementById("date").textContent = GIFT.date;
  document.getElementById("time").textContent = GIFT.time;
  document.getElementById("venue").textContent = GIFT.venue;
  document.getElementById("message").innerHTML = GIFT.message;

  const stage = document.getElementById("stage");
  const gift = document.getElementById("gift");

  function open() {
    if (stage.classList.contains("opened")) return;
    stage.classList.add("opened");
    document.querySelector(".ticket").removeAttribute("aria-hidden");
    if (navigator.vibrate) navigator.vibrate(80);
    setTimeout(confetti, 250);
  }

  function confetti() {
    const colors = ["#e8366f", "#ffd166", "#06d6a0", "#118ab2", "#ffffff", "#c77dff"];
    for (let i = 0; i < 140; i++) {
      const c = document.createElement("div");
      c.className = "confetti";
      c.style.left = Math.random() * 100 + "vw";
      c.style.background = colors[i % colors.length];
      c.style.borderRadius = Math.random() > .5 ? "50%" : "2px";
      c.style.setProperty("--dx", (Math.random() * 200 - 100) + "px");
      c.style.setProperty("--rot", (Math.random() * 1080) + "deg");
      c.style.animationDuration = (2.5 + Math.random() * 2.5) + "s";
      c.style.animationDelay = (Math.random() * .6) + "s";
      document.body.appendChild(c);
      c.addEventListener("animationend", () => c.remove());
    }
  }

  gift.addEventListener("click", open);
  gift.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); open(); } });
</script>
</body>
</html>
